name: Release

# Tag push (v*) → smoke gate, build, package, sign + notarize, publish DMG +
# zip to the GitHub Release. FAILS CLOSED: missing signing secrets abort the
# job before packaging — an unsigned artifact must never reach the
# auto-update channel.
# Publishing uses `gh release` rather than electron-builder's publisher:
# its parallel upload tasks race to create the release and die on 422
# already_exists when releaseType is "release" (drafts break releases/latest).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit dependencies including the shipped Electron runtime
        run: npm audit --audit-level=high
      - name: Assert tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi
      - name: Require signing credentials (fail closed)
        if: env.HAS_SIGNING_CERT != 'true'
        run: |
          echo "MAC_CSC_LINK is not set — refusing to build an unsigned release." >&2
          exit 1
      - run: npm run typecheck
      # The artifact that ships must clear at least the gate PRs clear.
      - run: npm run smoke:all
      - run: npm run build
      - name: Package, sign, notarize
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Gatekeeper verification
        run: |
          app="release/mac-arm64/Shelf.app"
          codesign --verify --deep --strict "$app"
          spctl -a -t exec -vv "$app"
          xcrun stapler validate "$app"
      - name: Publish artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Shelf $GITHUB_REF_NAME" \
              --notes "See [changelog.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/changelog.md) for details."
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/Shelf-arm64.dmg \
            release/Shelf-arm64.zip \
            release/Shelf-arm64.dmg.blockmap \
            release/Shelf-arm64.zip.blockmap \
            release/latest-mac.yml
